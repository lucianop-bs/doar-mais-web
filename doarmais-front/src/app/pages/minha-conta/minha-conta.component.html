<div class="page">
  <header class="page-header">
    <button class="btn-voltar" (click)="voltar()">
      <i class="bi bi-arrow-left"></i> Voltar
    </button>
    <h2>Minha Conta</h2>
  </header>

  <section class="card-panel">
    <h3>Dados Pessoais</h3>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="field">
        <label>Nome</label>
        <input type="text" formControlName="nome" />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" formControlName="email" />
      </div>
      <button type="submit" class="btn-salvar" [disabled]="form.invalid">
        Salvar alterações
      </button>
    </form>
  </section>

  <section class="card-panel danger-zone">
    <h3>Zona de Perigo</h3>
    <p>Excluir sua conta é permanente e remove todos os seus acessos.</p>
    <button type="button" class="btn-excluir" (click)="excluirConta()">
      <i class="bi bi-trash-fill"></i> Excluir minha conta
    </button>
  </section>
</div>
