<div class="row justify-content-center align-items-center min-h">
  <div class="col-12 col-md-5 col-lg-5">
    <div class="card border-0 shadow-lg mt-5">
      <div class="card-body p-5">
        <h2 class="text-center mb-4 fw-bold text-color fs-1">Cadastrar</h2>
        <p class="text-muted text-center mb-4">Crie sua conta para doar.</p>
        @if (errorMessage()) {
          <div
            class="alert alert-danger d-flex align-items-center alert-dismissible fade show"
            role="alert"
          >
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            {{ errorMessage() }}
            <button
              type="button"
              class="btn-close"
              (click)="errorMessage.set(null)"
              aria-label="Close"
            ></button>
          </div>
        }
        <form [formGroup]="cadastroForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label fw-semibold" for="">Nome</label>
            <input
              type="text"
              formControlName="nome"
              class="form-control form-control-lg"
              placeholder="Digite seu nome"
              [class.is-invalid]="
                cadastroForm.get('nome')?.invalid && cadastroForm.get('nome')?.touched
              "
            />
            <div class="invalid-feedback">Nome é obrigatório.</div>
          </div>
           <div class="mb-4">
            <label class="form-label fw-semibold">E-mail</label>
            <input
              type="email"
              formControlName="email"
              class="form-control form-control-lg"
              placeholder="Digite seu e-mail"
              [class.is-invalid]="cadastroForm.get('email')?.invalid && cadastroForm.get('email')?.touched"
            />
            <div class="invalid-feedback">O e-mail é obrigatorio</div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Senha</label>
            <input
              type="password"
              formControlName="senha"
              class="form-control form-control-lg"
              placeholder="Digite sua senha"
              [class.is-invalid]="
                cadastroForm.get('senha')?.invalid && cadastroForm.get('senha')?.touched
              "
            />
            <div class="invalid-feedback">A senha é obrigatoria</div>
          </div>
          <button
            type="submit"
            class="btn btn-outline-light btn-color btn-lg w-100 mb-3 shadow"
            [disabled]="cadastroForm.invalid"
          >
            Cadastrar
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
