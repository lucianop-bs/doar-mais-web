<div class="row justify-content-center align-items-center min-h">
  <div class="col-12 col-md-5 col-lg-5">
    <div class="card border-0 shadow-lg mt-5">
      <div class="card-body p-5">
        <h2 class="text-center mb-4 fw-bold text-color fs-1">Entrar</h2>
        <p class="text-muted text-center mb-4">Acesse sua conta para doar.</p>
        @if (errorMessage()) {
          <div class="alert alert-danger d-flex align-items-center alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            {{ errorMessage() }}
            <button type="button" class="btn-close" (click)="errorMessage.set(null)" aria-label="Close"></button>
          </div>
        }
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label fw-semibold" for="">E-mail</label>
            <input
              type="email"
              formControlName="email"
              class="form-control form-control-lg"
              placeholder="email@email.com"
              [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
            />
            <div class="invalid-feedback">E-mail inválido ou obrigatório.</div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Senha</label>
            <input
              type="password"
              formControlName="senha"
              class="form-control form-control-lg"
              placeholder="Digite sua senha"
              [class.is-invalid]="loginForm.get('senha')?.invalid && loginForm.get('senha')?.touched"
            />
            <div class="invalid-feedback">A senha é obrigatoria</div>
          </div>
          <button
            type="submit"
            class="btn btn-outline-light btn-color btn-lg w-100 mb-3 shadow "
            [disabled]="loginForm.invalid"
          >
            Entrar
          </button>
          <div class="text-center">
            <span class="text-muted">Ainda não tem conta?</span>
            <a routerLink="/cadastro" class="text-decoration-none fw-bold ms-1">Cadastre-se</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
