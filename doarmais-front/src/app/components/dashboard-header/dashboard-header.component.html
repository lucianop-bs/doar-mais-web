<header class="dashboard-header">
  <div class="left">
    <h2>Dashboard DOAR+</h2>
    <span class="user">Logado como <strong>{{ usuario()?.nome ?? '...' }}</strong></span>
  </div>

  <div class="center">
    <span class="label">Capacidade de Cestas:</span>
    <span class="total">{{ totalCestas() }}</span>
  </div>

  <div class="right">
    <button type="button" class="btn-refresh" (click)="refresh.emit()" title="Atualizar dados">
      <i class="bi bi-arrow-clockwise"></i> Atualizar
    </button>
    <a routerLink="/relatorios" class="btn-relatorios">
      <i class="bi bi-bar-chart-fill"></i> Relatórios
    </a>
    @if (isAdmin()) {
      <a routerLink="/usuarios" class="btn-admin">
        <i class="bi bi-people-fill"></i> Gerenciar Usuários
      </a>
    }
  </div>
</header>
