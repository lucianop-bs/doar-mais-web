# ---------------------------------------------------------
# DATABASE & DEV SERVICES (Embedded PostgreSQL)
# ---------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
# Força a conexão na porta fixa do banco embutido
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/postgres
# Configurações do Banco Embutido para Persistência em Disco
quarkus.embedded.postgresql.data.dir=C:/Dev/db_doarmais
quarkus.embedded.postgresql.port=5433
# ---------------------------------------------------------
# HIBERNATE ORM
# ---------------------------------------------------------
# 'drop-and-create' recria o banco toda vez, rodando o import.sql
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.hibernate-orm.log.sql=true
# ---------------------------------------------------------
# SEGURANÇA (JWT)
# ---------------------------------------------------------
mp.jwt.verify.issuer=doarmais-api
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey.location=publicKey.pem
# Lê o JWT a partir do cookie HttpOnly chamado "token"
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=token
# ---------------------------------------------------------
# SERVER & CORS (Para o Angular na porta 4200)
# ---------------------------------------------------------
quarkus.http.port=8080
# Habilita o CORS
quarkus.http.cors=true
# Permite o frontend Angular
quarkus.http.cors.origins=http://localhost:4200
# Permite os métodos necessários
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
# Permite os cabeçalhos de autenticação e conteúdo
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
# Necessário para o browser enviar cookies cross-origin
quarkus.http.cors.access-control-allow-credentials=true
# ---------------------------------------------------------
# LOGGING & DOCUMENTAÇÃO
# ---------------------------------------------------------
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.swagger-ui.path=/swagger
quarkus.smallrye-openapi.info-title=API DoarMais
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Documentação dos endpoints do sistema DoarMais
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=Autenticacao_JWT
quarkus.smallrye-openapi.security-scheme-description=Insira apenas o token gerado no login (sem a palavra Bearer)
